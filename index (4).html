<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thesis Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="tl-style">
/* Layout: matches the D214 Investing app shell. Dark navy ground, sticky header over a ticker tape, red-topped cards; district red marks action, green/red only for gains and verdicts. Deliberately single-theme (dark). */
:root{
  --bg:#0f1720; --surface:#141e29; --surface-2:#1a2531; --ink:#e6ebf1; --white:#ffffff; --muted:#aab4c3; --dim:#8a97a8; --line:#223041; --line-3:#34455a;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#2a1720; --link:#ef5b70;
  --gold:#e0b45a; --gold-soft:#221d14; --cream:#e8d7b0;
  --good:#45c08a; --good-soft:#14261e; --bad:#f0606f; --bad-soft:#2d161b; --warn:#e0b45a; --warn-soft:#221d14;
  --tape:#0b1219; --tape-ink:#e6ebf1; --rule:#3a1a24;
  --c-stock:#ef5b70; --c-bond:#6b8fbf; --c-mm:#c9a34e; --c-cash:#4a5768;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:clamp(16px,3vw,40px);padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:900;color:var(--white)}
h3{font-size:1.3rem;font-weight:700;color:var(--white)}
p{margin:0}
a{color:var(--link)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* Masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * clamp(16px,3vw,40px));background:var(--bg);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1320px;margin:0 auto;padding:14px clamp(16px,3vw,40px) 0;display:flex;flex-direction:column;gap:10px}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.9rem;font-weight:900;color:var(--white);white-space:nowrap}.brand h1 b{color:var(--accent)}.brand h1 small{font-family:var(--f-body);font-size:.8rem;letter-spacing:.3em;font-weight:700;color:var(--muted)}
.brand .tick{font-family:var(--f-mono);font-size:.75rem;color:var(--cream);border:1px solid var(--line-3);padding:2px 8px;border-radius:999px}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttape{background:var(--tape);border-top:1px solid var(--rule);overflow:hidden}
.ttape-in{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);display:flex;gap:30px;height:42px;align-items:center;white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-family:var(--f-mono);font-size:.85rem}
.ttape-in::-webkit-scrollbar{display:none}
.ttape .s{color:var(--white);font-weight:500}.ttape .p{color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px 12px;font-family:var(--f-body);font-weight:500;font-size:1.02rem;color:var(--muted);border-bottom:3px solid transparent}.tab:hover{color:var(--white)}
.tab[aria-selected="true"]{color:var(--white);border-bottom-color:var(--accent)}
.tab .badge{font-family:var(--f-mono);font-size:.7rem;background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:0 6px;margin-left:4px}

/* Tape */
.tape{background:var(--surface);color:var(--tape-ink);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.tape .round{font-family:var(--f-body);font-weight:600;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--link)}
.tape .head{font-family:var(--f-display);font-weight:900;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;color:var(--white)}
.tape .story{max-width:72ch;color:var(--muted);font-size:1.02rem}
.macro{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mstat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line-3);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mstat .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;color:var(--white)}
.mstat .d{font-family:var(--f-mono);font-size:.75rem}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-even{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
@media (max-width:880px){.grid2{grid-template-columns:minmax(0,1fr)}}
.temptation{border:1px solid #4a3c1f;background:var(--gold-soft);color:var(--cream);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.temptation .lab{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);white-space:nowrap;padding-top:2px}
.note{background:var(--surface-2);color:var(--muted);border-radius:var(--r);padding:10px 12px;font-size:.9rem}
.alert{border-left:3px solid var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:.9rem}
.okline{border-left:3px solid var(--good);background:var(--good-soft);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:.9rem}

/* Tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #1c2733;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.name{font-family:var(--f-body);white-space:normal;min-width:150px}
td.name b{font-family:var(--f-mono);font-weight:500;color:var(--white)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
td.name small{display:block;color:var(--muted);font-size:.78rem}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:default}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.newsline{font-family:var(--f-body);font-size:.8rem;color:var(--muted);white-space:normal;text-align:left;padding-top:0}

/* Stamps */
.stamp{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-body);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.s-consistent,.s-credit{color:var(--good);background:var(--good-soft)}
.s-partial{color:var(--warn);background:var(--warn-soft)}
.s-violation{color:var(--bad);background:var(--bad-soft)}
.s-hidden{color:var(--muted);background:var(--surface-2)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}

/* Forms */
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500}
.lab-s{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
.btn{border:1px solid var(--line-3);background:transparent;border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:.92rem;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#a90d27;border-color:#a90d27}
.btn.gold{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:6px 18px;font-weight:600;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--white)}
.seg button.sell[aria-pressed="true"]{background:#1b3a2d;color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.emo{display:flex;gap:6px}
.emo button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 0;font-family:var(--f-mono);font-weight:600}
.emo button[aria-pressed="true"]{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.preview{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* Thesis */
.thesis-card{border:1px solid var(--line);border-top:4px solid var(--tc,var(--accent));border-radius:var(--r);padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
button.thesis-card:hover{background:var(--surface-2)}
.thesis-card[aria-pressed="true"]{background:var(--surface-2);box-shadow:0 0 0 2px var(--tc,var(--accent)) inset}
.thesis-card .tname{font-family:var(--f-display);font-size:1.5rem;font-weight:900;color:var(--tc,var(--white))}
.thesis-card .fit{font-family:var(--f-mono);font-size:.72rem;color:var(--gold)}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:.9rem;align-items:baseline}
.rules .rid{font-family:var(--f-mono);font-weight:600;font-size:.78rem;color:var(--good)}
.rules li.k-sell .rid{color:var(--bad)} .rules li.k-risk .rid{color:var(--gold)} .rules li.k-hold .rid,.rules li.k-cash .rid{color:var(--muted)}
.charter{border:1px solid var(--line);border-top:4px solid var(--tc,var(--accent));border-radius:var(--r);padding:24px 26px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.charter blockquote{margin:0;font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.3;color:var(--white);border-left:3px solid var(--tc,var(--gold));padding-left:14px}
.quiz-q{display:flex;flex-direction:column;gap:8px}
.quiz-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.quiz-opts button{border:1px solid var(--line-3);background:var(--bg);border-radius:999px;padding:10px 18px;text-align:left;font-weight:500}
.quiz-opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--white)}

/* Report */
.score-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.big{display:flex;flex-direction:column;gap:4px;padding:20px 22px;border:1px solid var(--line);border-top:4px solid var(--line-3);border-radius:var(--r);background:var(--surface)}
.big .v{font-family:var(--f-mono);font-size:2.2rem;font-weight:500;line-height:1.1;color:var(--white)}
.big.lead{border-top-color:var(--accent)}
.big.lead .v{font-family:var(--f-display);font-weight:900;color:var(--white);font-size:3.4rem}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:.82rem}
.quad .c{border:1px solid var(--line);border-radius:4px;padding:10px;min-height:64px;background:var(--surface)}
.quad .c.on{border:1px solid var(--accent);border-top:4px solid var(--accent);background:var(--accent-soft)}
.quad .ax{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.audit{display:flex;flex-direction:column}
.audit-r{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:112px minmax(0,1fr) 48px;gap:10px;align-items:start;font-size:.9rem}
.item .sc{font-family:var(--f-mono);font-weight:600;text-align:right}
.item ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.84rem}
@media (max-width:560px){.item{grid-template-columns:1fr 48px}.item .stampcell{grid-column:1/-1}}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}

/* Teacher */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.roundpips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:30px;height:30px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.8rem;background:var(--surface)}
.pip.done{background:var(--surface-2);color:var(--muted)}
.pip.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edit-grid input{padding:4px 6px;font-family:var(--f-mono);font-size:.8rem;width:72px}
.edit-grid input.wide{width:220px}
.edit-grid td{padding:4px}
.rtabs{display:flex;gap:4px;flex-wrap:wrap}
.rtabs button{border:1px solid var(--line-3);background:transparent;border-radius:999px;padding:6px 16px;font-weight:600;font-size:.88rem;color:var(--muted)}
.rtabs button[aria-pressed="true"]{background:var(--accent);color:var(--white);border-color:var(--accent)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface-2);color:var(--white);border:1px solid var(--line-3);border-top:3px solid var(--accent);padding:10px 16px;border-radius:4px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.stack{display:flex;flex-direction:column;gap:10px}
.hr{height:1px;background:var(--line)}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;width:120px;height:120px;border-radius:50%;flex-shrink:0}
.donut .hole{position:absolute;inset:22px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.mix{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;font-size:.88rem}
.mix div{display:flex;align-items:center;gap:8px}
.mix .num{margin-left:auto;color:var(--white)}
@media (prefers-reduced-motion:no-preference){.tape .head{animation:slide .5s ease-out}@keyframes slide{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}.ttape .chg{transition:color .3s}}
</style>

</head>

const SALT="thesislab|v1|integrity";
function b64e(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const s=atob(str);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
async function pipe(bytes,Stream){const cs=new Stream("deflate-raw");const w=cs.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer());}
async function encodeState(st){
  const body=JSON.stringify(Object.assign({},st,{overrides:undefined,_id:undefined}));
  const payload=JSON.stringify({y:Y().name,s:body,k:fnv(body+SALT).toString(36)});
  const raw=new TextEncoder().encode(payload);
  if(typeof CompressionStream!=="undefined"){try{return "TL1Z."+b64e(await pipe(raw,CompressionStream))}catch(e){}}
  return "TL1J."+b64e(raw);
}
async function decodeState(code){
  code=String(code||"").trim();const m=code.match(/^TL1([ZJ])\.([A-Za-z0-9_-]+)$/);if(!m)throw new Error("format");
  let bytes=b64d(m[2]);if(m[1]==="Z")bytes=await pipe(bytes,DecompressionStream);
  const p=JSON.parse(new TextDecoder().decode(bytes));const st=JSON.parse(p.s);
  return{st,year:p.y,sigOk:fnv(p.s+SALT).toString(36)===p.k};
}

/* ============================================================
   MARKET MATH
   ============================================================ */
const Y=()=>S.market.year;
const nR=()=>Y().rounds.length;
const meta=t=>Y().assets.find(a=>a.t===t);
const dat=(t,r)=>{const R=Y().rounds[r-1];return R&&R.data&&R.data[t]||null;};
function regime(r){const m=Y().rounds[r-1].macro,pm=r>1?Y().rounds[r-2].macro:null;
  if((pm&&m.fed>pm.fed)||m.cpi>=3.5)return"Tightening";
  if((pm&&m.fed<pm.fed)||m.gdp<1)return"Easing";return"Neutral";}
function valueAt(cash,holdings,r){let v=cash;for(const[t,h]of Object.entries(holdings||{})){const d=dat(t,r);if(d&&h.sh>0)v+=h.sh*d.p;}return v;}
function weights(cash,holdings,r){const V=valueAt(cash,holdings,r);let fixed=cash;const w={};
  for(const[t,h]of Object.entries(holdings||{})){const d=dat(t,r),m=meta(t);if(!d||!m||!(h.sh>0))continue;const v=h.sh*d.p;w[t]=v/V*100;if(isFund(m))fixed+=v;}
  return{V,w,fixed:fixed/V*100};}
function ctxFor(st,t,r,hold){
  const a=dat(t,r),pv=r>1?dat(t,r-1):null,m=meta(t);
  return{a,pv,meta:m,P:st.params,reg:regime(r),
    chg:pv&&pv.p?(a.p/pv.p-1)*100:null,
    gain:hold&&hold.sh>0?(a.p/hold.cost-1)*100:null,
    trimGain:hold&&hold.sh>0?(a.p/(hold.base||hold.cost)-1)*100:null};
}
function indexAt(r){const st=Y().assets.filter(a=>a.type==="stock");let s=0,n=0;
  for(const a of st){const d0=dat(a.t,1),d=dat(a.t,r);if(d0&&d){s+=d.p/d0.p;n++;}}return n?s/n:1;}

/* ============================================================
   JUDGING
   ============================================================ */
function judgeTrade(st,side,t,sh,r,cite,evidence){
  const th=THESES[st.thesis],P=st.params,m=meta(t),a=dat(t,r),hold=st.holdings[t];
  const c=ctxFor(st,t,r,hold);
  const before=weights(st.cash,st.holdings,r);
  const h2=clone(st.holdings);const val=sh*a.p;
  if(side==="buy"){h2[t]=h2[t]||{sh:0,cost:a.p};h2[t].sh+=sh}else{h2[t].sh-=sh}
  const after=weights(side==="buy"?st.cash-val:st.cash+val,h2,r);
  let v="consistent",reasons=[],tags=[],just=[];
  if(side==="buy"){
    const res=th.buy(c);
    if(res.fail.length){v="violation";res.fail.forEach(x=>reasons.push(`${x[0]} not met: ${x[1]}`));if(c.chg!=null&&c.chg>=40)tags.push("FOMO buy");}
    else{just=res.pass;reasons.push(`Met ${res.pass.join(", ")}`);}
    if(!isFund(m)&&P.maxPos&&(after.w[t]||0)>P.maxPos+.01){v="violation";tags.push("Oversized");reasons.push(`R1: position would be ${after.w[t].toFixed(1)}% (limit ${P.maxPos}%)`);}
    if(P.minFixed!=null&&!isFund(m)&&after.fixed<P.minFixed-.01){v="violation";reasons.push(`R2: bonds and cash would drop to ${after.fixed.toFixed(1)}% (minimum ${P.minFixed}%)`);}
  }else{
    const trig=th.sells(c).slice();
    if(!isFund(m)&&P.maxPos&&(before.w[t]||0)>P.maxPos+.01)trig.push(["R1","trim",`Position was ${before.w[t].toFixed(1)}% (limit ${P.maxPos}%)`]);
    if(P.minFixed!=null&&!isFund(m)&&before.fixed<P.minFixed)trig.push(["R2","trim",`Bonds and cash were ${before.fixed.toFixed(1)}% (minimum ${P.minFixed}%)`]);
    if(trig.length){
      just=trig.map(x=>x[0]);trig.forEach(x=>reasons.push(`${x[0]}: ${x[2]}`));
      const frac=hold&&hold.sh?sh/hold.sh:1;
      const onlyTrim=trig.every(x=>x[1]==="trim"||x[1]==="optional")&&!trig.some(x=>x[1]==="exit")&&trig.some(x=>x[1]==="trim")&&!trig.some(x=>x[0]==="R1"||x[0]==="R2");
      if(onlyTrim&&frac>.6&&!trig.some(x=>x[1]==="optional")){v="partial";reasons.push(`Rule says trim, but you sold ${(frac*100).toFixed(0)}% of the position`);}
    }else{
      const R=Y().rounds[r-1];
      if((c.chg!=null&&c.chg<=-15)||(R.panic&&c.chg!=null&&c.chg<0)){v="violation";tags.push("Panic sell");reasons.push(`Sold after a ${Math.abs(c.chg).toFixed(0)}% drop with no sell rule triggered`);}
      else{v="partial";reasons.push("No sell rule applied to this sale");}
    }
  }
  let score=v==="consistent"?100:v==="partial"?60:0;
  if(v!=="violation"){
    if(!cite||cite==="none"){score-=15;reasons.push("No rule cited on the ticket");}
    else if(just.length&&!just.includes(cite)){score-=15;reasons.push(`Cited ${cite}, but the rule that applies is ${just.join(" or ")}`);}
    if(!/\d/.test(evidence||"")){score-=10;reasons.push("Evidence did not cite a number from the data");}
  }
  return{v,score:Math.max(0,score),reasons,tags,just};
}

function obligationsAt(st,r){
  const th=THESES[st.thesis],P=st.params,out=[];const wt=weights(st.cash,st.holdings,r);
  for(const[t,h]of Object.entries(st.holdings||{})){
    if(!(h.sh>0))continue;const m=meta(t);if(!m||!dat(t,r))continue;
    const c=ctxFor(st,t,r,h);
    th.sells(c).filter(x=>x[1]==="exit"||x[1]==="trim").forEach(x=>out.push({t,id:x[0],type:x[1],why:x[2]}));
    if(!isFund(m)&&P.maxPos&&(wt.w[t]||0)>P.maxPos+.01)out.push({t,id:"R1",type:"size",why:`${t} is ${wt.w[t].toFixed(1)}% of the portfolio (limit ${P.maxPos}%)`});
  }
  if(P.minFixed!=null&&wt.fixed<P.minFixed-.01)out.push({t:null,id:"R2",type:"alloc",why:`Bonds and cash are ${wt.fixed.toFixed(1)}% (minimum ${P.minFixed}%)`});
  return out;
}

function audit(st){
  const items=[];if(!st||!st.thesis)return{items,score:null};
  const released=st.unlocked||0;
  const ov=st.overrides||{};
  const push=it=>{const o=ov[it.id];if(o){it.auto=it.score;it.score=o.score;it.v=o.score>=90?"consistent":o.score>=50?"partial":"violation";it.note=o.note||"";it.over=true;}items.push(it);};
  for(const tr of st.trades||[]){
    push({id:tr.id,r:tr.r,kind:"trade",label:`${tr.side==="buy"?"Bought":"Sold"} ${tr.sh} ${tr.t} @ ${money2(tr.px)}`,v:tr.verdict.v,score:tr.verdict.score,reasons:tr.verdict.reasons,tags:tr.verdict.tags,cite:tr.cite,evidence:tr.evidence,emo:tr.emo,hidden:!(st.locks||{})["r"+tr.r]});
  }
  for(const[k,L]of Object.entries(st.locks||{})){
    const r=+k.slice(1);
    (L.missed||[]).forEach((o,i)=>push({id:`m_${r}_${i}`,r,kind:"missed",label:o.t?`Kept ${o.t} after ${o.id} triggered`:`Ignored ${o.id}`,v:o.score>=50?"partial":"violation",score:o.score,reasons:[o.why+(o.score>=50?" (you sold some, but not enough)":"")],tags:["Missed rule"]}));
    if(L.panicHold)push({id:`p_${r}`,r,kind:"credit",label:"Held through the panic",v:"credit",score:100,reasons:["Your holdings fell, no sell rule fired, and you did not sell"],tags:["Discipline"]});
    const w=words(L.journal);
    push({id:`j_${r}`,r,kind:"journal",label:"Round journal",v:w>=25?"consistent":w>=10?"partial":"violation",score:w>=25?100:w>=10?70:40,reasons:[`${w} words${w<25?" (aim for 25+)":""}`],journal:L.journal,emo:L.emo});
  }
  for(const am of st.amendments||[]){
    const ok=words(am.memo)>=40&&/round|\d/i.test(am.memo);
    push({id:am.id,r:am.r,kind:"amend",label:"Thesis amendment",v:ok?"consistent":"partial",score:ok?100:70,reasons:[Object.entries(am.changes||{}).map(([k,c])=>`${k}: ${c[0]} → ${c[1]}`).join("; ")||"Wording only",ok?"Memo cites evidence":"Memo should cite specific rounds or trades"],memo:am.memo});
  }
  const start=st.startRound||1;
  for(let r=start;r<released;r++){
    if(!(st.locks||{})["r"+r])push({id:`x_${r}`,r,kind:"missed",label:`Round ${r} not submitted`,v:"partial",score:50,reasons:["The round closed before you locked it"],tags:[]});
  }
  items.sort((a,b)=>a.r-b.r);
  const scored=items.filter(i=>!i.hidden);
  const score=scored.length?scored.reduce((s,i)=>s+i.score,0)/scored.length:null;
  return{items,score};
}
function perf(st){
  const r=Math.max(1,Math.min(st.unlocked||1,nR()));
  const V=valueAt(st.cash,st.holdings,r),sc=st.startCash||S.market.startCash;
  const start=st.startRound||1;
  const idx=indexAt(r)/indexAt(start);
  return{V,ret:(V/sc-1)*100,idxRet:(idx-1)*100,r};
}

function curRound(){return S.me&&S.me.unlocked||0;}
function roundOpen(st){const r=curRound();return r>=1&&st&&!(st.locks||{})["r"+r];}
function amendOpen(st){const r=curRound();return st&&r>1&&S.market.reviewAfter.includes(r-1)&&!(st.locks||{})["r"+r]&&!(st.trades||[]).some(t=>t.r===r)&&!(st.amendments||[]).some(a=>a.r===r);}

async function lockThesis(){
  const d=S.ui.draft,k=S.ui.pick;
  if(!k)return toast("Choose a thesis first.");
  const first=d.name.trim().split(/\s+/)[0]||"",ini=String(d.initial||"").trim().replace(/[^A-Za-z]/g,"").slice(0,1).toUpperCase();
  if(!first)return toast("Add your first name so your teacher can find you.");
  if(!ini)return toast("Add the first letter of your last name.");
  d.name=first.charAt(0).toUpperCase()+first.slice(1)+" "+ini+".";
  if(words(d.philosophy)<8)return toast("Write your philosophy in at least one full sentence.");
  if(words(d.falsifier)<6)return toast("Explain what would prove your thesis wrong.");
  const st={name:d.name.trim(),period:d.period.trim(),thesis:k,params:defaultParams(k),philosophy:d.philosophy.trim(),falsifier:d.falsifier.trim(),
    cash:S.market.startCash,startCash:S.market.startCash,holdings:{},trades:[],locks:{},amendments:[],unlocked:0,startRound:null,yearName:Y().name,quiz:S.ui.quiz,created:Date.now()};
  if(await saveMe(st)){S.view="desk";render();toast("Thesis locked. Enter the Round 1 code to open the market.");}
}
async function unlockRound(){
  const st=clone(S.me),cur=st.unlocked||0,code=normCode(S.ui.code);
  if(!code)return toast("Type the round code your teacher gave you.");
  if(cur>=1&&!(st.locks||{})["r"+cur])return toast(`Lock Round ${cur} first.`);
  let target=0;for(let r=cur+1;r<=nR();r++){if(normCode(roundCode(r))===code){target=r;break;}}
  if(!target)return toast("That code doesn't open a new round. Check it with your teacher.");
  st.unlocked=target;if(!st.startRound)st.startRound=target;
  if(await saveMe(st)){S.ui.code="";toast(`Round ${target} is open.`);window.scrollTo(0,0);}
}

async function restoreFromCode(){

async function placeTrade(){
  const st=clone(S.me),T=S.ui.ticket,r=curRound();
  if(!roundOpen(st))return toast("This round is locked.");
  const t=T.t,sh=Math.floor(+T.sh);const a=dat(t,r);
  if(!t||!a)return toast("Pick an asset.");
  if(!(sh>0))return toast("Enter a whole number of shares.");
  if(!T.cite)return toast("Cite the rule that justifies this trade, or choose “No rule applies”.");
  if(words(T.evidence)<5)return toast("Write your evidence: what in the data supports this trade?");
  const val=sh*a.p;const h=st.holdings[t];
  if(T.side==="buy"&&val>st.cash+.001)return toast(`Not enough cash. You have ${money(st.cash)}.`);
  if(T.side==="sell"&&(!h||h.sh<sh))return toast(`You only own ${h?h.sh:0} shares of ${t}.`);
  const verdict=judgeTrade(st,T.side,t,sh,r,T.cite,T.evidence);
  if(T.side==="buy"){const n=h?h.sh:0;const cost=h?h.cost:a.p;st.holdings[t]={sh:n+sh,cost:(n*cost+sh*a.p)/(n+sh),base:h&&h.base?((n*h.base+sh*a.p)/(n+sh)):(n*cost+sh*a.p)/(n+sh)};st.cash-=val;}
  else{h.sh-=sh;st.cash+=val;if(verdict.just.some(j=>j==="S2"||j==="S1"&&st.thesis==="value"))h.base=a.p;if(h.sh<=0)delete st.holdings[t];}
  st.trades=(st.trades||[]).concat([{id:"t_"+uid(),r,side:T.side,t,sh,px:a.p,cite:T.cite,evidence:T.evidence.trim(),emo:T.emo,verdict,ts:Date.now()}]);
  if(await saveMe(st)){
    S.ui.ticket={side:T.side,t:"",sh:"",cite:"",evidence:"",emo:3};
    toast(S.market.hints?`Trade placed: ${verdict.v.toUpperCase()}`:"Trade placed. Verdict revealed when you lock the round.");
  }
}
async function lockRound(){
  const st=clone(S.me),r=curRound(),J=S.ui.journal;
  if(!roundOpen(st))return;
  if(words(J.text)<10)return toast("Write at least a few sentences in your round journal.");
  const obl=obligationsAt(st,r);
  const soldNow=new Set((st.trades||[]).filter(x=>x.r===r&&x.side==="sell").map(x=>x.t));
  const missed=obl.map(o=>{
    if(o.type==="alloc")return Object.assign({},o,{score:0});
    if(o.type==="size")return Object.assign({},o,{score:soldNow.has(o.t)?60:0});
    if(o.type==="trim")return soldNow.has(o.t)?null:Object.assign({},o,{score:0});
    return Object.assign({},o,{score:soldNow.has(o.t)?60:0});
  }).filter(Boolean);
  const R=Y().rounds[r-1];
  const panicSold=(st.trades||[]).some(x=>x.r===r&&x.verdict.tags.includes("Panic sell"));
  const fell=Object.keys(st.holdings).some(t=>{const c=ctxFor(st,t,r,st.holdings[t]);return meta(t).type==="stock"&&c.chg!=null&&c.chg<=-10;});
  const panicHold=!!(R.panic&&fell&&!panicSold);
  let income=0;
  for(const[t,h]of Object.entries(st.holdings)){const m=meta(t),d=dat(t,r);if(m&&d&&m.type!=="mm"&&d.y>0)income+=h.sh*d.p*d.y/100/nR();}
  st.cash+=income;
  st.locks=Object.assign({},st.locks,{["r"+r]:{journal:J.text.trim(),emo:J.emo,missed,panicHold,income,value:valueAt(st.cash,st.holdings,r),ts:Date.now()}});
  if(await saveMe(st)){S.ui.journal={text:"",emo:3};S.view="report";render();toast("Round locked. Your verdicts are in.");}
}
async function submitAmend(){
  const st=clone(S.me),A=S.ui.amend,r=curRound();
  if(!amendOpen(st))return;
  if(words(A.memo)<40)return toast(`Your memo needs at least 40 words (you have ${words(A.memo)}).`);
  const changes={};
  for(const k of Object.keys(THESES[st.thesis].params)){const nv=A["p_"+k];if(nv!=null&&nv!==""&&+nv!==st.params[k]){const[,lo,hi]=THESES[st.thesis].params[k];const x=Math.min(hi,Math.max(lo,+nv));changes[k]=[st.params[k],x];st.params[k]=x;}}
  if(A.philosophy&&A.philosophy.trim()&&A.philosophy.trim()!==st.philosophy){changes.philosophy=["v"+((st.amendments||[]).length+1),"v"+((st.amendments||[]).length+2)];st.philosophy=A.philosophy.trim();}
  st.amendments=(st.amendments||[]).concat([{id:"a_"+uid(),r,changes,memo:A.memo.trim(),ts:Date.now()}]);
  if(await saveMe(st)){S.ui.amend={memo:""};toast("Amendment ratified. Your new rules apply from this round.");}
}

function chartSvg(st){
  const start=st.startRound||1,pts=[[start-1,st.startCash]];
  Object.entries(st.locks||{}).map(([k,L])=>[+k.slice(1),L.value]).sort((a,b)=>a[0]-b[0]).forEach(p=>pts.push(p));
  if(pts.length<2)return `<p class="muted">Your value line appears after you lock your first round.</p>`;
  const last=pts[pts.length-1][0];
  const idx=[];for(let r=start;r<=last;r++)idx.push([r,st.startCash*indexAt(r)/indexAt(start)]);idx.unshift([start-1,st.startCash]);
  const all=pts.concat(idx).map(p=>p[1]);let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.12||1000;lo-=pad;hi+=pad;
  const W=640,H=220,L=62,Rm=16,T=14,B=28;
  const x=r=>L+(r-(start-1))/(Math.max(1,last-(start-1)))*(W-L-Rm),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const path=a=>a.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join("");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Portfolio value by round compared with the market index">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${money(v)}</text>`).join("")}
   ${pts.map(p=>`<text x="${x(p[0])}" y="${H-8}" text-anchor="middle">${p[0]===start-1?"Start":"R"+p[0]}</text>`).join("")}
   <path d="${path(idx)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
   <path d="${path(pts)}" fill="none" stroke="var(--link)" stroke-width="2.5"/>
   ${pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="var(--link)"/>`).join("")}
  </svg></div><div class="row muted" style="font-size:.8rem"><span><b style="color:var(--link)">━</b> Your portfolio</span><span>┅ Market index (equal-weight stocks)</span></div>`;
}

    if(/assets\.(\d+)\.t$/.test(el.dataset.ybind)){ // rename ticker across rounds
      const i=+el.dataset.ybind.split(".")[1];const old=S.ui.yearDraft._oldT&&S.ui.yearDraft._oldT[i];
      const nv=String(v).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);S.ui.yearDraft.assets[i].t=nv;
      S.ui.yearDraft.rounds.forEach(R=>{const keys=Object.keys(R.data);const prev=old||keys.find(k=>!S.ui.yearDraft.assets.some(a=>a.t===k));if(prev&&prev!==nv&&R.data[prev]){R.data[nv]=R.data[prev];delete R.data[prev];}});
      delete S.ui.yearDraft._oldT;render();return;
    }
    setPath(S.ui.yearDraft,el.dataset.ybind,v);
  }
  const ac=el.dataset.actChange;if(!ac)return;
  if(ac==="hints")await saveMarket({hints:el.checked});
  if(ac==="codeWord")await saveMarket({codeWord:el.value.trim()});
  if(ac==="review"){const arr=el.value.split(/[,\s]+/).map(Number).filter(x=>x>0&&x<nR());await saveMarket({reviewAfter:[...new Set(arr)].sort((a,b)=>a-b)});}
  if(ac==="cash"){const v=Math.max(1000,Math.round(+el.value||100000));await saveMarket({startCash:v});}
  if(ac==="override"){const v=el.value;await saveOverride(el.dataset.sid,el.dataset.item,v===""?null:{score:+v,note:""});}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="rcode"){e.preventDefault();unlockRound();}});
document.addEventListener("focusin",e=>{const el=e.target;const m=el.dataset&&el.dataset.ybind&&el.dataset.ybind.match(/^assets\.(\d+)\.t$/);if(m&&S.ui.yearDraft){S.ui.yearDraft._oldT=S.ui.yearDraft._oldT||{};S.ui.yearDraft._oldT[+m[1]]=el.value;}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
  const act=b.dataset.act,k=b.dataset.k;
  switch(act){
    case"view":S.view=k;S.ui.confirm=null;render();window.scrollTo(0,0);break;
    case"quiz":S.ui.quiz[b.dataset.i]=k;render();break;
    case"pick":S.ui.pick=k;if(!S.ui.draft.philosophy)S.ui.draft.philosophy="";render();break;
    case"lockThesis":await lockThesis();break;
    case"restartThesis":{const st=S.me;if(st&&!(st.trades||[]).length){S.ui.pick=st.thesis;{const pr=String(st.name||"").split(" ");S.ui.draft={name:pr[0]||"",initial:(pr[1]||"").replace(/\W/g,""),period:st.period,philosophy:st.philosophy,falsifier:st.falsifier};}S.me=null;try{localStorage.removeItem("tl.me")}catch(_){}render();}break;}
    case"unlock":await unlockRound();break;
    case"turnIn":await turnIn();break;
    case"restore":await restoreFromCode();break;
    case"importCodes":await importCodes(S.ui.imp);break;
    case"publish":await publishToStudents();break;
    case"showCodes":S.ui.showCodes=!S.ui.showCodes;render();break;
    case"copyCode":await copyText(roundCode(+k));break;
    case"pickAsset":S.ui.ticket.t=k;if(S.view!=="desk"){S.view="desk";}render();{const el=document.getElementById("tk-sh");if(el)el.focus();}break;
    case"side":S.ui.ticket.side=k;render();break;
    case"emo":S.ui.ticket.emo=+k;render();break;
    case"jemo":S.ui.journal.emo=+k;render();break;
    case"trade":await placeTrade();break;
    case"lockRound":await lockRound();break;
    case"amend":await submitAmend();break;
    case"copyReport":await copyText(reportText(S.me));break;
    case"copyStudent":{const st=S.students.find(x=>x._id===k);if(st)await copyText(reportText(st));break;}
    case"tsub":S.ui.tsub=k;S.ui.confirm=null;render();break;
    case"tsel":S.ui.tSel=S.ui.tSel===k?null:k;S.ui.confirm=null;render();break;
    case"askDel":S.ui.confirm="del:"+k;render();break;
    case"delStudent":S.ui.confirm=null;S.ui.tSel=null;await deleteStudent(k);render();break;
    case"cancel":S.ui.confirm=null;render();break;
    case"askSample":S.ui.confirm="sample";render();break;
    case"loadSample":S.ui.yearDraft=sampleYear();S.ui.yr=1;S.ui.confirm=null;render();toast("Sample year loaded into the draft. Save to apply it.");break;
    case"yr":S.ui.yr=+k;render();break;
    case"addRound":{const Yd=S.ui.yearDraft,last=Yd.rounds[Yd.rounds.length-1];Yd.rounds.push(Object.assign(clone(last),{title:"New round",headline:"Headline goes here",story:"",temptation:"",panic:false}));Object.values(Yd.rounds[Yd.rounds.length-1].data).forEach(d=>delete d.news);S.ui.yr=Yd.rounds.length;render();break;}
    case"rmRound":{const Yd=S.ui.yearDraft;if(Yd.rounds.length>1){Yd.rounds.pop();S.ui.yr=Math.min(S.ui.yr,Yd.rounds.length);render();}break;}
    case"addAsset":{const Yd=S.ui.yearDraft;let t="NEW",n=1;while(Yd.assets.some(a=>a.t===t))t="NEW"+(++n);Yd.assets.push({t,name:"New Company",sector:"Technology",type:"stock",beta:1});Yd.rounds.forEach(R=>R.data[t]={p:50,pe:15,g:5,m:8,fcf:50,de:.8,y:0,po:0});render();break;}
    case"rmAsset":{const Yd=S.ui.yearDraft,i=+k,t=Yd.assets[i].t;Yd.assets.splice(i,1);Yd.rounds.forEach(R=>delete R.data[t]);render();break;}
    case"saveYear":{const Yd=clone(S.ui.yearDraft);delete Yd._oldT;const tk=Yd.assets.map(a=>a.t);if(new Set(tk).size!==tk.length||tk.some(t=>!t))return toast("Every asset needs a unique ticker.");
      const rv=S.market.reviewAfter.filter(x=>x<Yd.rounds.length);
      if(await saveMarket({year:Yd,reviewAfter:rv}))toast("Year saved. Publish to students when you're ready.");break;}
    case"exportYear":{const txt=JSON.stringify(S.ui.yearDraft||Y());S.ui.io=txt;render();await copyText(txt);break;}
    case"importYear":{try{const y=JSON.parse(S.ui.io);if(!y||!Array.isArray(y.assets)||!Array.isArray(y.rounds)||!y.rounds.length)throw 0;y.rounds.forEach(R=>{R.macro=Object.assign({fed:0,cpi:0,gdp:0,unemp:0,oil:0},R.macro||{});R.data=R.data||{};});S.ui.yearDraft=y;S.ui.yr=1;render();toast("Imported into the draft. Review it, then save.");}catch(_){toast("That text is not a Thesis Lab year. Copy a year from this page and paste it again.");}break;}
  }
});

initStore();
setTimeout(()=>{if(!S.ready){S.ready=true;render();}},12000);
})();
</script>
